worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 3m;          # 2MB upload limit + multipart overhead
  sendfile on;
  keepalive_timeout 65;

  # Docker's embedded DNS; re-resolves `api` so all replicas are used.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Layer 7 load balancing across API replicas (PRD 6.4)
  upstream bengkel_api {
    least_conn;
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Coarse edge throttle; fine-grained limits live in the API (Redis sliding window).
  limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;

  server {
    listen 80;
    # Terminate TLS here (or at Cloudflare) in production and redirect 80 -> 443.

    location / {
      limit_req zone=edge burst=60 nodelay;
      limit_req_status 429;   # "Too Many Requests", not 503 (which reads as "server down")
      proxy_pass http://bengkel_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, don't append: blocks spoofed client IPs
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
